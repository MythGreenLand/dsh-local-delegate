# dsh-local-delegate bundle patch.
#
# Inserts the Host half of the plugin. Everything about the endpoint lives in
# this row's `config`: to point at another machine, protocol, or model, override
# the same row id in your profile `cordis.patch.yml` (the last patch layer wins).
#
# The fallback below is the local Ollama instance on this workstation: when the
# intranet server is down, mechanical work degrades to a slower but available
# model instead of failing. Remove it if that machine has no local Ollama.
- insert:
    - id: local-delegate
      name: 'dsh-local-delegate'
      config:
        enabled: true
        retries: 1
        endpoint:
          kind: ollama-native
          baseURL: http://10.0.101.11:11434
          model: gemma4:e2b
          think: false
          keepAlive: 30m
          numCtx: 32768
          timeoutMs: 120000
        fallbackEndpoints:
          - kind: ollama-native
            baseURL: http://127.0.0.1:11434
            model: gemma4:26b
            think: false
            keepAlive: 15m
            numCtx: 32768
            timeoutMs: 240000
        chunkChars: 4000
        maxConcurrency: 2
        maxInlineChars: 8000
        allowRoots: []
